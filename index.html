<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body class="body">
    <div class="calculator-box">

<input class= "display" type="text" id="display" readonly value="0">
<div class="grid-container">
    
<button class='grid-element' id="btn-AC" type ="button">
AC
</button>
<button class='grid-element' id="btn-+/-" type ="button">
+/- 
</button>
<button class='grid-element' id="btn-%" type ="button">
%
</button>
<button class='grid-element' id="btn-/" type ="button">
/
</button>
<button class='grid-element' id="btn-7" type ="button">
7
</button>
<button class='grid-element' id="btn-8" type ="button">
8
</button>
<button class='grid-element' id="btn-9" type ="button">
9
</button>
<button class='grid-element' id="btn-*" type ="button">
*
</button>
<button class='grid-element' id="btn-4" type ="button">
4
</button>
<button class='grid-element' id="btn-5" type ="button">
5
</button>
<button class='grid-element' id="btn-6" type ="button">
6
</button>
<button class='grid-element' id="btn--" type ="button">
- 
</button>
<button class='grid-element' id="btn-1" type ="button">
1
</button>
<button class='grid-element' id="btn-2" type ="button">
2
</button>
<button class='grid-element' id="btn-3" type ="button">
3
</button>
<button class='grid-element' id="btn-+" type ="button">
+
</button>
<button class='grid-element ' id="btn-x^2" type ="button">
x<sup>2</sup>
<button class='grid-element ' id="btn-0" type ="button">
0
<button class='grid-element ' id="btn-," type ="button">
,
</button>
<button class='grid-element ' id="btn-=" type ="button">
=
</button>
</div>
  </div>
   <link rel="stylesheet" href="styles.css">
    <script src="Calculator.js"></script>
</body>
</html>
