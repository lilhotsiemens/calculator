<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор</title>
   <script src="Calculator2.js" defer></script>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calc-box">
    <div class="grid-container">

    <input type="text" value="0" id="display" class="display" readonly>

<button class="calc-butt grey" id="butt-AC">AC</button>
<button class="calc-butt grey" id="butt-+/-">+/-</button>
<button class="calc-butt grey" id="butt-%">%</button>
<button class="calc-butt yellow" id="butt-/">/</button>
<button class="calc-butt" id="butt-7">7</button>
<button class="calc-butt" id="butt-8">8</button>
<button class="calc-butt" id="butt-9">9</button>
<button class="calc-butt yellow" id="butt-*">*</button>
<button class="calc-butt" id="butt-4">4</button>
<button class="calc-butt" id="butt-5">5</button>
<button class="calc-butt" id="butt-6">6</button>
<button class="calc-butt yellow" id="butt--">-</button>
<button class="calc-butt" id="butt-1">1</button>
<button class="calc-butt" id="butt-2">2</button>
<button class="calc-butt" id="butt-3">3</button>
<button class="calc-butt yellow" id="butt-+">+</button>
<button class="calc-butt" id="butt-x2">x<sup>2</sup></button>
<button class="calc-butt" id="butt-0">0</button>
<button class="calc-butt" id="butt-.">.</button>
<button class="calc-butt yellow" id="butt-=">=</button>

    </div>
    </div>
</body>
</html>
